name: cade-meu-dinheiro

services:
  postgres:
    image: postgres:16-alpine
    container_name: cade-meu-dinheiro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cade_meu_dinheiro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cade_meu_dinheiro}
      POSTGRES_DB: ${POSTGRES_DB:-cade_meu_dinheiro}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cade_meu_dinheiro}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cade-meu-dinheiro

  redis:
    image: redis:7-alpine
    container_name: cade-meu-dinheiro-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cade-meu-dinheiro

  object-storage:
    image: minio/minio:latest
    container_name: cade-meu-dinheiro-object-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-cade_meu_dinheiro}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-cade_meu_dinheiro_secret}
    ports:
      - "${STORAGE_PORT:-9000}:9000"
      - "${STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cade-meu-dinheiro

networks:
  cade-meu-dinheiro:
    name: cade-meu-dinheiro-network

volumes:
  postgres-data:
    name: cade-meu-dinheiro-postgres-data
  redis-data:
    name: cade-meu-dinheiro-redis-data
  object-storage-data:
    name: cade-meu-dinheiro-object-storage-data
